AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ReportBank advertiser contracts and resilient Stripe webhook processing

Parameters:
  AppName:
    Type: String
    Default: reportbank
  AdsTableName:
    Type: String
    Default: reportbank-ads
    Description: Name of the existing DynamoDB table used for advertisements
  AppUrl:
    Type: String
    Description: Public site origin used in administrator review links
  StripeSecretKey:
    Type: String
    NoEcho: true
  MicroCmsServiceId:
    Type: String
  MicroCmsAdsWriteApiKey:
    Type: String
    NoEcho: true
  MicroCmsManagementApiKey:
    Type: String
    NoEcho: true
  AdminNotificationTopicArn:
    Type: String
    Description: ARN of the existing SNS topic that receives administrator review notifications

Resources:
  StripeEventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-stripe-events-dlq.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false

  StripeEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-stripe-events.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StripeEventsDeadLetterQueue.Arn
        maxReceiveCount: 5

  StripeWebhookWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-stripe-webhook-worker"
      Runtime: nodejs24.x
      Handler: index.handler
      CodeUri: ../dist/stripe-webhook-worker
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ADS_TABLE_NAME: !Ref AdsTableName
          MICROCMS_ADS_ENDPOINT: articles
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          MICROCMS_SERVICE_ID: !Ref MicroCmsServiceId
          MICROCMS_ADS_WRITE_API_KEY: !Ref MicroCmsAdsWriteApiKey
          MICROCMS_MANAGEMENT_API_KEY: !Ref MicroCmsManagementApiKey
          ADMIN_NOTIFICATION_TOPIC_ARN: !Ref AdminNotificationTopicArn
          NEXT_PUBLIC_APP_URL: !Ref AppUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdsTableName
        - SQSPollerPolicy:
            QueueName: !GetAtt StripeEventsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AdminNotificationTopicArn
      Events:
        StripeEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt StripeEventsQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  AdsTableName:
    Value: !Ref AdsTableName
  StripeEventsQueueUrl:
    Value: !Ref StripeEventsQueue
  AdminNotificationTopicArn:
    Value: !Ref AdminNotificationTopicArn
