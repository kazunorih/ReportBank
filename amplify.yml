version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - test -n "$MICROCMS_SERVICE_ID" || { echo "ERROR: MICROCMS_SERVICE_ID is not set"; exit 1; }
        - test -n "$MICROCMS_API_KEY" || { echo "ERROR: MICROCMS_API_KEY is not set"; exit 1; }
        - rm -f .env.production
        - printf 'MICROCMS_SERVICE_ID=%s\n' "$MICROCMS_SERVICE_ID" >> .env.production
        - printf 'MICROCMS_API_KEY=%s\n' "$MICROCMS_API_KEY" >> .env.production
        - echo "microCMS environment variables prepared successfully"
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
