name: Monthly trade statistics

on:
  schedule:
    # 03:00 UTC = 12:00 Asia/Tokyo, every month on day 28.
    - cron: '0 3 28 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-trade-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: tmp/ports/cache
          key: trade-ports-v1-${{ github.run_id }}
          restore-keys: trade-ports-v1-
      - name: Install dependencies
        run: |
          python -m pip install -r scripts/requirements-trade.txt
          npm ci
      - name: Collect and validate official monthly releases
        run: python scripts/refresh-monthly-trade.py
      - name: Test published snapshots and importers
        run: |
          python scripts/test_trade_history.py
          python scripts/test_port_trade.py
          python scripts/test_monthly_trade.py
          node node_modules/vitest/vitest.mjs run lib/reports/trade.test.ts lib/reports/port-trade.test.ts lib/reports/observation-insights.test.ts
          node node_modules/typescript/bin/tsc --noEmit
      - name: Commit validated data for Amplify auto-build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/reports/data/trade.json lib/reports/data/port-trade.json lib/reports/data/port-trade-sources.json lib/reports/data/trade-insight.json
          if git diff --cached --quiet; then
            echo 'No published data changes.'
            exit 0
          fi
          git commit -m 'data: refresh monthly trade statistics'
          git push
