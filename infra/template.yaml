AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ReportBank advertiser contracts and resilient Stripe webhook processing

Parameters:
  AppName:
    Type: String
    Default: reportbank
  CognitoCallbackUrl:
    Type: String
    Default: http://localhost:3000/advertiser
  StripeSecretKey:
    Type: String
    NoEcho: true
  MicroCmsServiceId:
    Type: String
  MicroCmsAdsWriteApiKey:
    Type: String
    NoEcho: true
  MicroCmsManagementApiKey:
    Type: String
    NoEcho: true

Resources:
  AdvertiserUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-advertisers"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  AdvertiserUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-web"
      UserPoolId: !Ref AdvertiserUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref AdvertiserUserPool
  AdsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-ads"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  StripeEventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-stripe-events-dlq.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false

  StripeEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-stripe-events.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StripeEventsDeadLetterQueue.Arn
        maxReceiveCount: 5

  StripeWebhookWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-stripe-webhook-worker"
      Runtime: nodejs24.x
      Handler: index.handler
      CodeUri: ../dist/stripe-webhook-worker
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ADS_TABLE_NAME: !Ref AdsTable
          MICROCMS_ADS_ENDPOINT: articles
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          MICROCMS_SERVICE_ID: !Ref MicroCmsServiceId
          MICROCMS_ADS_WRITE_API_KEY: !Ref MicroCmsAdsWriteApiKey
          MICROCMS_MANAGEMENT_API_KEY: !Ref MicroCmsManagementApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt StripeEventsQueue.QueueName
      Events:
        StripeEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt StripeEventsQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  AdsTableName:
    Value: !Ref AdsTable
  StripeEventsQueueUrl:
    Value: !Ref StripeEventsQueue
  CognitoUserPoolId:
    Value: !Ref AdvertiserUserPool
  CognitoUserPoolClientId:
    Value: !Ref AdvertiserUserPoolClient
